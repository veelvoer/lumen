name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in Cargo.toml and have release notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ -s "release-notes/$V.md" ] || { echo "release-notes/$V.md is missing: every release needs notes"; exit 1; }
          grep -q '^version = "'"$V"'"' Cargo.toml || { echo "Cargo.toml is not $V"; exit 1; }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Build and sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export LUMEN_KS="$RUNNER_TEMP/release.jks" LUMEN_KS_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" LUMEN_KEY_ALIAS=lumen LUMEN_KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          scripts/build-apk.sh
      - run: cp "release-notes/${GITHUB_REF_NAME#v}.md" NOTES.md
      - uses: softprops/action-gh-release@v2
        with: { files: "Lumen-*.apk", body_path: NOTES.md }
